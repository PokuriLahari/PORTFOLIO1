<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#080612; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <!-- Deep Dark Obsidian Violet Gradients & Glows -->
    <linearGradient id="sage-dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0B1C"/>
      <stop offset="50%" stop-color="#090714"/>
      <stop offset="100%" stop-color="#05040B"/>
    </linearGradient>

    <linearGradient id="violet-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="lavender-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="box-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151028"/>
      <stop offset="100%" stop-color="#0E0A1E"/>
    </linearGradient>

    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#sage-dark-bg)"/>

  <!-- Subtle Cyber Grid in Violet/Lavender -->
  <g opacity="0.12" stroke="#8B5CF6" stroke-width="0.75">
    <path d="M 0 60 L 960 60 M 0 120 L 960 120 M 0 180 L 960 180 M 0 240 L 960 240 M 0 300 L 960 300 M 0 360 L 960 360 M 0 420 L 960 420 M 0 480 L 960 480" />
    <path d="M 80 0 L 80 540 M 160 0 L 160 540 M 240 0 L 240 540 M 320 0 L 320 540 M 400 0 L 400 540 M 480 0 L 480 540 M 560 0 L 560 540 M 640 0 L 640 540 M 720 0 L 720 540 M 800 0 L 800 540 M 880 0 L 880 540" />
  </g>

  <!-- Ambient Light Blobs -->
  <circle cx="200" cy="120" r="140" fill="#7C3AED" opacity="0.08" filter="url(#glow-violet)"/>
  <circle cx="750" cy="380" r="160" fill="#A855F7" opacity="0.06" filter="url(#glow-violet)"/>

  <!-- Outer Cyber Border in Violet & Lavender -->
  <rect x="14" y="14" width="932" height="512" rx="12" fill="none" stroke="#8B5CF6" stroke-width="1.8" opacity="0.85"/>
  <rect x="18" y="18" width="924" height="504" rx="10" fill="none" stroke="#2E1F4D" stroke-width="1.2"/>

  <!-- Top Retro Title Bar -->
  <g id="title-bar">
    <rect x="28" y="26" width="160" height="30" rx="6" fill="#181130" stroke="#8B5CF6" stroke-width="1.4"/>
    <text x="42" y="46" fill="#C4B5FD" font-size="12" font-weight="800" font-family="'Fragment Mono', monospace" letter-spacing="1.5">SAGE.ENGINE</text>

    <!-- Center Architecture Title Banner -->
    <rect x="250" y="24" width="460" height="34" rx="6" fill="#16102D" stroke="#A78BFA" stroke-width="1.5" filter="url(#soft-glow)"/>
    <text x="480" y="45" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="2">
      &gt;&gt;&gt; SYSTEM ARCHITECTURE &lt;&lt;&lt;
    </text>
    <text x="480" y="54" text-anchor="middle" fill="#DDD6FE" font-size="7.5" font-weight="700" font-family="'Fragment Mono', monospace" letter-spacing="2.2">
      GROUNDED AI · JWT SECURED · POSTGRESQL PERSISTENCE
    </text>

    <rect x="750" y="26" width="180" height="30" rx="6" fill="#181130" stroke="#8B5CF6" stroke-width="1.4"/>
    <text x="840" y="46" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="800" font-family="'Fragment Mono', monospace" letter-spacing="1.5">[ PRODUCTION ARCH ]</text>
  </g>

  <!-- LEFT: INPUTS LAYER -->
  <g id="inputs-layer" transform="translate(32, 80)">
    <rect x="0" y="0" width="150" height="340" rx="10" fill="#120E24" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect x="0" y="0" width="150" height="32" rx="8" fill="url(#violet-primary)"/>
    <text x="75" y="21" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">INPUT DATA</text>

    <!-- Input Cards -->
    <g transform="translate(10, 48)">
      <rect width="130" height="48" rx="6" fill="#1A1433" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.6"/>
      <text x="12" y="21" fill="#FFFFFF" font-size="10.5" font-weight="700">Student Inquiry</text>
      <text x="12" y="37" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Natural language</text>
    </g>
    <g transform="translate(10, 108)">
      <rect width="130" height="48" rx="6" fill="#1A1433" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.6"/>
      <text x="12" y="21" fill="#FFFFFF" font-size="10.5" font-weight="700">Course Syllabus</text>
      <text x="12" y="37" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Curriculum docs</text>
    </g>
    <g transform="translate(10, 168)">
      <rect width="130" height="48" rx="6" fill="#1A1433" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.6"/>
      <text x="12" y="21" fill="#FFFFFF" font-size="10.5" font-weight="700">Tasks &amp; Deadlines</text>
      <text x="12" y="37" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Calendar timelines</text>
    </g>
    <g transform="translate(10, 228)">
      <rect width="130" height="48" rx="6" fill="#1A1433" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.6"/>
      <text x="12" y="21" fill="#FFFFFF" font-size="10.5" font-weight="700">Academic History</text>
      <text x="12" y="37" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Progress metrics</text>
    </g>
  </g>

  <!-- Flow Connector 1 -->
  <path d="M 182 250 L 222 250" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="224,250 216,245 216,255" fill="#C084FC"/>

  <!-- CENTER CORE SYSTEM (3 Layers) -->
  <g id="core-system" transform="translate(225, 80)">
    <!-- Layer 1: API Gateway & Security -->
    <rect x="0" y="0" width="490" height="98" rx="10" fill="#120E24" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect x="0" y="0" width="490" height="26" rx="8" fill="url(#violet-primary)"/>
    <text x="16" y="18" fill="#FFFFFF" font-size="11.5" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">1. API GATEWAY &amp; SECURITY LAYER</text>

    <!-- Sub-boxes in Layer 1 -->
    <g transform="translate(16, 38)">
      <rect width="140" height="48" rx="6" fill="#191336" stroke="#A78BFA" stroke-width="1.2"/>
      <text x="10" y="20" fill="#E9D5FF" font-size="10.5" font-weight="800">FastAPI Gateway</text>
      <text x="10" y="36" fill="#C4B5FD" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Async routing &amp; CORS</text>
    </g>
    <g transform="translate(172, 38)">
      <rect width="145" height="48" rx="6" fill="#191336" stroke="#A78BFA" stroke-width="1.2"/>
      <text x="10" y="20" fill="#E9D5FF" font-size="10.5" font-weight="800">JWT Security Guard</text>
      <text x="10" y="36" fill="#C4B5FD" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Bearer token auth</text>
    </g>
    <g transform="translate(332, 38)">
      <rect width="142" height="48" rx="6" fill="#191336" stroke="#A78BFA" stroke-width="1.2"/>
      <text x="10" y="20" fill="#E9D5FF" font-size="10.5" font-weight="800">Rate Limiting</text>
      <text x="10" y="36" fill="#C4B5FD" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Token bucket policy</text>
    </g>

    <!-- Layer 2: Grounded AI & RAG Engine -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="490" height="115" rx="10" fill="#120E24" stroke="#A855F7" stroke-width="1.8"/>
      <rect x="0" y="0" width="490" height="26" rx="8" fill="url(#lavender-gradient)"/>
      <text x="16" y="18" fill="#FFFFFF" font-size="11.5" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">2. GROUNDED AI &amp; RAG ENGINE</text>

      <g transform="translate(16, 38)">
        <rect width="140" height="62" rx="6" fill="#191336" stroke="#C084FC" stroke-width="1.2"/>
        <text x="10" y="20" fill="#F5F3FF" font-size="10.5" font-weight="800">Context Retriever</text>
        <text x="10" y="36" fill="#DDD6FE" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Syllabus &amp; rubric</text>
        <text x="10" y="52" fill="#A78BFA" font-size="8" font-family="'Fragment Mono', monospace">Hybrid search</text>
      </g>
      <g transform="translate(172, 38)">
        <rect width="145" height="62" rx="6" fill="#191336" stroke="#C084FC" stroke-width="1.2"/>
        <text x="10" y="20" fill="#F5F3FF" font-size="10.5" font-weight="800">Vector Embeddings</text>
        <text x="10" y="36" fill="#DDD6FE" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Semantic chunks</text>
        <text x="10" y="52" fill="#A78BFA" font-size="8" font-family="'Fragment Mono', monospace">Cosine similarity</text>
      </g>
      <g transform="translate(332, 38)">
        <rect width="142" height="62" rx="6" fill="#191336" stroke="#C084FC" stroke-width="1.2"/>
        <text x="10" y="20" fill="#F5F3FF" font-size="10.5" font-weight="800">AI Synthesizer</text>
        <text x="10" y="36" fill="#DDD6FE" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Grounded guidance</text>
        <text x="10" y="52" fill="#A78BFA" font-size="8" font-family="'Fragment Mono', monospace">Zero hallucinations</text>
      </g>
    </g>

    <!-- Layer 3: Persistence & Scheduling -->
    <g transform="translate(0, 246)">
      <rect x="0" y="0" width="490" height="94" rx="10" fill="#120E24" stroke="#7C3AED" stroke-width="1.8"/>
      <rect x="0" y="0" width="490" height="26" rx="8" fill="#6D28D9"/>
      <text x="16" y="18" fill="#FFFFFF" font-size="11.5" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">3. PERSISTENCE &amp; SCHEDULING</text>

      <g transform="translate(16, 36)">
        <rect width="140" height="46" rx="6" fill="#191336" stroke="#8B5CF6" stroke-width="1.2"/>
        <text x="10" y="20" fill="#E9D5FF" font-size="10.5" font-weight="800">PostgreSQL DB</text>
        <text x="10" y="34" fill="#C4B5FD" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">User profiles &amp; tasks</text>
      </g>
      <g transform="translate(172, 36)">
        <rect width="145" height="46" rx="6" fill="#191336" stroke="#8B5CF6" stroke-width="1.2"/>
        <text x="10" y="20" fill="#E9D5FF" font-size="10.5" font-weight="800">Reminder Queue</text>
        <text x="10" y="34" fill="#C4B5FD" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Async cron worker</text>
      </g>
      <g transform="translate(332, 36)">
        <rect width="142" height="46" rx="6" fill="#191336" stroke="#8B5CF6" stroke-width="1.2"/>
        <text x="10" y="20" fill="#E9D5FF" font-size="10.5" font-weight="800">Cache &amp; Sessions</text>
        <text x="10" y="34" fill="#C4B5FD" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Sub-10ms response</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector 2 -->
  <path d="M 715 250 L 755 250" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="757,250 749,245 749,255" fill="#C084FC"/>

  <!-- RIGHT: OUTPUT LAYER -->
  <g id="output-layer" transform="translate(760, 80)">
    <rect x="0" y="0" width="165" height="340" rx="10" fill="#120E24" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect x="0" y="0" width="165" height="32" rx="8" fill="url(#violet-primary)"/>
    <text x="82" y="21" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">CLIENT INTERFACES</text>

    <g transform="translate(10, 48)">
      <rect width="145" height="54" rx="6" fill="#1A1433" stroke="#A78BFA" stroke-width="1"/>
      <text x="10" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Student Workspace</text>
      <text x="10" y="38" fill="#DDD6FE" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Clean UI dashboard</text>
    </g>
    <g transform="translate(10, 114)">
      <rect width="145" height="54" rx="6" fill="#1A1433" stroke="#A78BFA" stroke-width="1"/>
      <text x="10" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Guided Recommendations</text>
      <text x="10" y="38" fill="#DDD6FE" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Step-by-step roadmap</text>
    </g>
    <g transform="translate(10, 180)">
      <rect width="145" height="54" rx="6" fill="#1A1433" stroke="#A78BFA" stroke-width="1"/>
      <text x="10" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Deadline Alerts</text>
      <text x="10" y="38" fill="#DDD6FE" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Automated email/SMS</text>
    </g>
    <g transform="translate(10, 246)">
      <rect width="145" height="54" rx="6" fill="#1A1433" stroke="#A78BFA" stroke-width="1"/>
      <text x="10" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Progress Telemetry</text>
      <text x="10" y="38" fill="#DDD6FE" opacity="0.85" font-size="8.5" font-family="'Fragment Mono', monospace">Weekly performance</text>
    </g>
  </g>

  <!-- Bottom Tech Ticker in Lavender & Violet -->
  <g transform="translate(32, 438)">
    <rect width="893" height="74" rx="10" fill="#100C22" stroke="#8B5CF6" stroke-width="1.4"/>
    <rect x="14" y="12" width="130" height="24" rx="4" fill="#6D28D9"/>
    <text x="79" y="28" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">STACK CREDENTIALS</text>

    <!-- Badges Row -->
    <g transform="translate(155, 12)">
      <rect x="0" y="0" width="105" height="24" rx="4" fill="#1E163B" stroke="#A78BFA" stroke-width="1"/>
      <text x="52" y="16" text-anchor="middle" fill="#E9D5FF" font-size="9.5" font-weight="700">FastAPI (Python)</text>

      <rect x="115" y="0" width="115" height="24" rx="4" fill="#1E163B" stroke="#A78BFA" stroke-width="1"/>
      <text x="172" y="16" text-anchor="middle" fill="#E9D5FF" font-size="9.5" font-weight="700">JWT Authentication</text>

      <rect x="240" y="0" width="115" height="24" rx="4" fill="#1E163B" stroke="#A78BFA" stroke-width="1"/>
      <text x="297" y="16" text-anchor="middle" fill="#E9D5FF" font-size="9.5" font-weight="700">PostgreSQL (SQLAlchemy)</text>

      <rect x="365" y="0" width="115" height="24" rx="4" fill="#1E163B" stroke="#A78BFA" stroke-width="1"/>
      <text x="422" y="16" text-anchor="middle" fill="#E9D5FF" font-size="9.5" font-weight="700">Vector Embeddings</text>

      <rect x="490" y="0" width="110" height="24" rx="4" fill="#1E163B" stroke="#A78BFA" stroke-width="1"/>
      <text x="545" y="16" text-anchor="middle" fill="#E9D5FF" font-size="9.5" font-weight="700">Docker Container</text>

      <rect x="610" y="0" width="115" height="24" rx="4" fill="#1E163B" stroke="#A78BFA" stroke-width="1"/>
      <text x="667" y="16" text-anchor="middle" fill="#E9D5FF" font-size="9.5" font-weight="700">CI/CD Pipeline</text>
    </g>

    <!-- Bottom metric notes -->
    <text x="28" y="58" fill="#DDD6FE" font-size="10" font-family="'Fragment Mono', monospace">
      &gt; Pipeline Latency: &lt;140ms  |  Accuracy Check: Strict Context Grounding  |  Security: End-to-end Token Auth
    </text>
  </g>
</svg>
