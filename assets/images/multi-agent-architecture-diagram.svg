<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background:#090714; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <!-- Deep Obsidian Violet Gradients & Glows -->
    <linearGradient id="multi-dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0B1C"/>
      <stop offset="50%" stop-color="#090714"/>
      <stop offset="100%" stop-color="#05040B"/>
    </linearGradient>

    <linearGradient id="multi-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="multi-lavender" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <filter id="glow-violet-multi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow-multi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#multi-dark-bg)"/>

  <!-- Subtle Cyber Grid in Violet/Lavender -->
  <g opacity="0.10" stroke="#8B5CF6" stroke-width="0.75">
    <path d="M 0 60 L 960 60 M 0 120 L 960 120 M 0 180 L 960 180 M 0 240 L 960 240 M 0 300 L 960 300 M 0 360 L 960 360 M 0 420 L 960 420 M 0 480 L 960 480" />
    <path d="M 80 0 L 80 540 M 160 0 L 160 540 M 240 0 L 240 540 M 320 0 L 320 540 M 400 0 L 400 540 M 480 0 L 480 540 M 560 0 L 560 540 M 640 0 L 640 540 M 720 0 L 720 540 M 800 0 L 800 540 M 880 0 L 880 540" />
  </g>

  <!-- Outer Cyber Border in Violet & Lavender -->
  <rect x="14" y="14" width="932" height="512" rx="10" fill="none" stroke="#8B5CF6" stroke-width="1.8" opacity="0.85"/>
  <rect x="18" y="18" width="924" height="504" rx="8" fill="none" stroke="#261A42" stroke-width="1.4"/>

  <!-- Top Retro Title Bar -->
  <g id="title-bar">
    <rect x="28" y="26" width="180" height="30" rx="5" fill="#181130" stroke="#8B5CF6" stroke-width="1.4"/>
    <text x="38" y="46" fill="#C4B5FD" font-size="12" font-weight="800" font-family="'Fragment Mono', monospace" letter-spacing="1.5">MULTI-AGENT.AI</text>

    <!-- Center System Architecture Banner -->
    <rect x="250" y="24" width="460" height="34" rx="5" fill="#16102D" stroke="#A78BFA" stroke-width="1.5" filter="url(#soft-glow-multi)"/>
    <text x="480" y="45" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="2">
      &gt;&gt;&gt; MULTI-AGENT PIPELINE &lt;&lt;&lt;
    </text>
    <text x="480" y="54" text-anchor="middle" fill="#DDD6FE" font-size="7.5" font-weight="700" font-family="'Fragment Mono', monospace" letter-spacing="2.2">
      INGESTION &gt; VECTOR LAKE &gt; RAG RETRIEVAL &gt; SYNTHESIS
    </text>

    <rect x="750" y="26" width="180" height="30" rx="5" fill="#181130" stroke="#8B5CF6" stroke-width="1.4"/>
    <text x="840" y="46" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="800" font-family="'Fragment Mono', monospace" letter-spacing="1.5">[ DOC INTELLIGENCE ]</text>
  </g>

  <!-- LEFT: MULTI-FORMAT DOCUMENT INPUTS -->
  <g id="doc-inputs" transform="translate(32, 80)">
    <rect width="150" height="340" rx="8" fill="#130E26" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect width="150" height="32" rx="6" fill="url(#multi-violet)"/>
    <text x="75" y="21" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">RAW DOCUMENTS</text>

    <g transform="translate(10, 48)">
      <rect width="130" height="48" rx="6" fill="#1B1436" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.6"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">PDF Technical Specs</text>
      <text x="12" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Tables &amp; Schematics</text>
    </g>
    <g transform="translate(10, 108)">
      <rect width="130" height="48" rx="6" fill="#1B1436" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.6"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">DOCX &amp; Reports</text>
      <text x="12" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Unstructured prose</text>
    </g>
    <g transform="translate(10, 168)">
      <rect width="130" height="48" rx="6" fill="#1B1436" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.6"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">JSON &amp; CSV Data</text>
      <text x="12" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Tabular parameters</text>
    </g>
    <g transform="translate(10, 228)">
      <rect width="130" height="48" rx="6" fill="#1B1436" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.6"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Natural Queries</text>
      <text x="12" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">User questions</text>
    </g>
  </g>

  <!-- Flow to Ingestion -->
  <path d="M 184 250 L 220 250" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="6,3" fill="none"/>
  <polygon points="222,250 214,245 214,255" fill="#C084FC"/>

  <!-- CENTER: 3 SPECIALIZED AI AGENTS & VECTOR MEMORY LAKE -->
  <g id="agents-and-lake" transform="translate(225, 80)">
    <!-- Layer 1: Specialized Agents Team -->
    <rect width="490" height="155" rx="8" fill="#130E26" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect width="490" height="26" rx="6" fill="url(#multi-violet)"/>
    <text x="16" y="18" fill="#FFFFFF" font-size="11.5" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">SPECIALIZED AGENT COLLABORATION LAYER</text>

    <!-- Agent 1: Ingestion Agent -->
    <g transform="translate(16, 38)">
      <rect width="140" height="102" rx="6" fill="#1A1336" stroke="#8B5CF6" stroke-width="1.4"/>
      <rect x="8" y="8" width="34" height="20" rx="3" fill="#7C3AED"/>
      <text x="25" y="22" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="900">#01</text>
      <text x="48" y="23" fill="#E9D5FF" font-size="11" font-weight="800">Ingestion</text>
      <text x="10" y="46" fill="#FFFFFF" font-size="10" font-weight="600">Doc Chunking</text>
      <text x="10" y="62" fill="#DDD6FE" opacity="0.8" font-size="8.5">Metadata tagger</text>
      <text x="10" y="78" fill="#DDD6FE" opacity="0.8" font-size="8.5">Parser &amp; OCR cleans</text>
      <text x="10" y="93" fill="#C084FC" font-size="8" font-family="'Fragment Mono', monospace">FastAPI Task Queue</text>
    </g>

    <!-- Agent 2: RAG Retrieval Agent -->
    <g transform="translate(172, 38)">
      <rect width="145" height="102" rx="6" fill="#1A1336" stroke="#A855F7" stroke-width="1.4"/>
      <rect x="8" y="8" width="34" height="20" rx="3" fill="#A855F7"/>
      <text x="25" y="22" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="900">#02</text>
      <text x="48" y="23" fill="#E9D5FF" font-size="11" font-weight="800">Retrieval</text>
      <text x="10" y="46" fill="#FFFFFF" font-size="10" font-weight="600">Vector Search</text>
      <text x="10" y="62" fill="#DDD6FE" opacity="0.8" font-size="8.5">Cosine similarity</text>
      <text x="10" y="78" fill="#DDD6FE" opacity="0.8" font-size="8.5">Hybrid rank re-scoring</text>
      <text x="10" y="93" fill="#C084FC" font-size="8" font-family="'Fragment Mono', monospace">Top-k Context Recall</text>
    </g>

    <!-- Agent 3: Evidence Synthesizer Agent -->
    <g transform="translate(332, 38)">
      <rect width="142" height="102" rx="6" fill="#1A1336" stroke="#8B5CF6" stroke-width="1.4"/>
      <rect x="8" y="8" width="34" height="20" rx="3" fill="#7C3AED"/>
      <text x="25" y="22" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="900">#03</text>
      <text x="48" y="23" fill="#E9D5FF" font-size="11" font-weight="800">Synthesizer</text>
      <text x="10" y="46" fill="#FFFFFF" font-size="10" font-weight="600">Evidence Ground</text>
      <text x="10" y="62" fill="#DDD6FE" opacity="0.8" font-size="8.5">Citation anchors</text>
      <text x="10" y="78" fill="#DDD6FE" opacity="0.8" font-size="8.5">Multi-source merge</text>
      <text x="10" y="93" fill="#C084FC" font-size="8" font-family="'Fragment Mono', monospace">Hallucination Gate</text>
    </g>

    <!-- Layer 2: Vector Memory Lake & Embedding Store -->
    <g transform="translate(0, 175)">
      <rect width="490" height="165" rx="8" fill="#130E26" stroke="#A855F7" stroke-width="1.8"/>
      <rect width="490" height="26" rx="6" fill="url(#multi-lavender)"/>
      <text x="16" y="18" fill="#FFFFFF" font-size="11.5" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">
        PROJECT MEMORY LAKE &amp; VECTOR EMBEDDINGS (SQLITE / INDEX)
      </text>

      <g transform="translate(18, 38)">
        <rect width="135" height="52" rx="5" fill="#1A1336" stroke="#A78BFA" stroke-width="1.2"/>
        <text x="10" y="22" fill="#E9D5FF" font-size="10.5" font-weight="800">Chunk Store</text>
        <text x="10" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">SQLite Relational Meta</text>
      </g>
      <g transform="translate(172, 38)">
        <rect width="145" height="52" rx="5" fill="#1A1336" stroke="#A78BFA" stroke-width="1.2"/>
        <text x="10" y="22" fill="#E9D5FF" font-size="10.5" font-weight="800">Vector Embeddings</text>
        <text x="10" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Dense text-embedding-3</text>
      </g>
      <g transform="translate(335, 38)">
        <rect width="138" height="52" rx="5" fill="#1A1336" stroke="#A78BFA" stroke-width="1.2"/>
        <text x="10" y="22" fill="#E9D5FF" font-size="10.5" font-weight="800">Hindsight Memory</text>
        <text x="10" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Session &amp; query cache</text>
      </g>

      <!-- Connection pipeline in Memory Lake -->
      <g transform="translate(18, 102)">
        <rect width="455" height="48" rx="6" fill="#1E163B" stroke="#A78BFA" stroke-width="1.2"/>
        <text x="16" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">⚡ High-Speed Vector Bus:</text>
        <text x="16" y="38" fill="#DDD6FE" font-size="8.5" font-family="'Fragment Mono', monospace">&lt;50ms Semantic Match · Hybrid Dense+Sparse BM25 Index</text>
      </g>
    </g>
  </g>

  <!-- Flow to Outputs -->
  <path d="M 720 250 L 755 250" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="6,3" fill="none"/>
  <polygon points="757,250 749,245 749,255" fill="#C084FC"/>

  <!-- RIGHT: FINAL SYNTHESIZED OUTPUTS -->
  <g id="outputs-layer" transform="translate(760, 80)">
    <rect width="165" height="340" rx="8" fill="#130E26" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect width="165" height="32" rx="6" fill="url(#multi-violet)"/>
    <text x="82" y="21" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="900" font-family="'Fragment Mono', monospace" letter-spacing="1">VERIFIED ANSWERS</text>

    <g transform="translate(10, 48)">
      <rect width="145" height="48" rx="6" fill="#1B1436" stroke="#A78BFA" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Page-Ranked Citations</text>
      <text x="12" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Direct PDF snippets</text>
    </g>
    <g transform="translate(10, 108)">
      <rect width="145" height="48" rx="6" fill="#1B1436" stroke="#A78BFA" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Synthesized Summaries</text>
      <text x="12" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Cross-document briefs</text>
    </g>
    <g transform="translate(10, 168)">
      <rect width="145" height="48" rx="6" fill="#1B1436" stroke="#A78BFA" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">FastAPI Endpoints</text>
      <text x="12" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">JSON response payloads</text>
    </g>
    <g transform="translate(10, 228)">
      <rect width="145" height="48" rx="6" fill="#1B1436" stroke="#A78BFA" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="10.5" font-weight="700">Streamlit Interactive UI</text>
      <text x="12" y="38" fill="#DDD6FE" opacity="0.8" font-size="8.5" font-family="'Fragment Mono', monospace">Real-time Q&amp;A chat</text>
    </g>
  </g>

  <!-- BOTTOM RETRO STATUS BAR -->
  <g id="bottom-bar" transform="translate(32, 442)">
    <rect width="893" height="66" rx="8" fill="#110D24" stroke="#8B5CF6" stroke-width="1.4" opacity="0.95"/>
    <g transform="translate(20, 18)">
      <circle cx="10" cy="15" r="5" fill="#C084FC" filter="url(#glow-violet-multi)"/>
      <text x="24" y="19" fill="#FFFFFF" font-size="11.5" font-weight="700">MULTI-AGENT STATUS: PIPELINE ACTIVE</text>
      <text x="24" y="34" fill="#DDD6FE" opacity="0.8" font-size="9.5" font-family="'Fragment Mono', monospace">STREAMLIT + FASTAPI + VECTOR STORE · AUTONOMOUS AGENT ORCHESTRATION</text>
    </g>
    <g transform="translate(540, 20)">
      <rect width="160" height="26" rx="4" fill="#1B1436" stroke="#A78BFA" stroke-width="1"/>
      <text x="80" y="17" text-anchor="middle" fill="#E9D5FF" font-size="9.5" font-weight="700" font-family="'Fragment Mono', monospace">AGENTIC RAG PIPELINE</text>

      <rect x="175" y="0" width="135" height="26" rx="4" fill="#1B1436" stroke="#C084FC" stroke-width="1"/>
      <text x="242" y="17" text-anchor="middle" fill="#C084FC" font-size="9.5" font-weight="700" font-family="'Fragment Mono', monospace">ZERO HALLUCINATION</text>
    </g>
  </g>
</svg>
