<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
  <defs>
    <!-- Azure Classic Blue Gradient -->
    <linearGradient id="azureBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008AD7" />
      <stop offset="100%" stop-color="#005A9E" />
    </linearGradient>

    <!-- Metallic Edge Bevel -->
    <linearGradient id="azureBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Foundational Gold Star -->
    <linearGradient id="azureStarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagon Shape -->
  <polygon points="100,6 186,52 186,148 100,194 14,148 14,52" fill="url(#azureBorder)" stroke="#0F172A" stroke-width="2.5" />

  <!-- Inner Hexagon White Base -->
  <polygon points="100,13 178,55 178,143 100,186 22,143 22,55" fill="#FFFFFF" />

  <!-- Top Azure Blue Shield Header -->
  <path d="M22 55 L100 13 L178 55 L178 72 L22 72 Z" fill="url(#azureBlue)" />

  <!-- Microsoft 4-Color Grid Icon -->
  <g transform="translate(100, 34) scale(0.72)">
    <g transform="translate(-14, -14)">
      <rect x="0" y="0" width="13" height="13" fill="#F25022" />
      <rect x="15" y="0" width="13" height="13" fill="#7FBA00" />
      <rect x="0" y="15" width="13" height="13" fill="#00A4EF" />
      <rect x="15" y="15" width="13" height="13" fill="#FFB900" />
    </g>
  </g>

  <!-- "Microsoft Certified" in Top Banner -->
  <text x="100" y="63" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">
    Microsoft Certified
  </text>

  <!-- Category & Title -->
  <text x="100" y="93" fill="#0078D4" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" text-anchor="middle">
    AZURE
  </text>
  <text x="100" y="112" fill="#0F172A" font-family="'Bricolage Grotesque', 'Inter', sans-serif" font-size="17" font-weight="800" letter-spacing="0.2" text-anchor="middle">
    AI Fundamentals
  </text>

  <!-- AI-900 Exam Code Tag -->
  <g transform="translate(100, 131)">
    <rect x="-30" y="-8.5" width="60" height="17" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="0" y="3.5" fill="#475569" font-family="'Fragment Mono', monospace" font-size="8" font-weight="700" letter-spacing="1.2" text-anchor="middle">
      AI-900
    </text>
  </g>

  <!-- 1 Foundational Achievement Star -->
  <g transform="translate(100, 158) scale(1.1)">
    <polygon points="0,-8 2.4,-2.5 8,-2.5 3.6,1.5 5.2,7.2 0,3.6 -5.2,7.2 -3.6,1.5 -8,-2.5 -2.4,-2.5" fill="url(#azureStarGold)" stroke="#B45309" stroke-width="0.5" />
  </g>

  <!-- Bottom Azure Hex Accent Trim -->
  <polygon points="100,186 140,165 60,165" fill="#0078D4" opacity="0.15" />
</svg>
